name: Ray Therapeutics
description: 'Ray Therapeutics is a clinical-stage biotechnology company developing
  optogenetic, gene-based medicines to restore vision in people with blinding degenerative
  retinal diseases. Its approach reprograms surviving retinal neurons to detect light
  and transmit visual signals to the brain, independent of the underlying gene mutation.
  Lead programs include RTX-015 (retinitis pigmentosa and other inherited retinal
  diseases, Phase 1/2) and RTX-021 (Stargardt disease and geographic atrophy, IND-enabling).
  The company is a portfolio company of Norwest Venture Partners. Ray Therapeutics
  operates as a therapeutics developer and does not publish a public developer API,
  documentation, or developer portal.'
